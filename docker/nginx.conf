# RAPI admin dashboard + same-origin reverse proxy to the Rust API.

upstream rapi_backend {
    server rapi:1337;
    keepalive 16;
}

# Browser page navigations (Accept: text/html) to SPA routes such as /admin/users
# must load the React app; fetch()/XHR calls go to the backend.
map $http_accept $is_html_nav {
    default 0;
    ~text/html 1;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 64m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    # Live Preview Server-Sent Events: disable buffering.
    location = /api/preview/events {
        proxy_pass http://rapi_backend;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Built-in preview renderer is loaded inside an iframe (HTML navigation) -> always backend.
    location /admin/preview/render/ {
        proxy_pass http://rapi_backend;
    }

    location /admin/ {
        if ($is_html_nav) {
            rewrite ^ /index.html last;
        }
        proxy_pass http://rapi_backend;
    }

    location ~ ^/(api|uploads|graphql|health|ready|docs|openapi\.json)(/|$) {
        proxy_pass http://rapi_backend;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
