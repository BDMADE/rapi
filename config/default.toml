# Default RAPI configuration (overridden by environment variables)

[server]
env = "development"
host = "0.0.0.0"
port = 1337
public_url = "http://localhost:1337"
cors_origins = ["http://localhost:5173", "http://127.0.0.1:5173"]
log_format = "pretty"
enable_docs = true
request_timeout_secs = 30
max_body_bytes = 10485760

[database]
url = "sqlite://data/rapi.db?mode=rwc"

[storage]
upload_dir = "./data/uploads"
web_dist_dir = "./web/dist"
